<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AffinityNeo 업무 관리</title>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}

</style></head><body>
<header><div class="logo">Affinity<span>Neo</span></div><div class="grow"></div><span class="mu" id="todayLabel"></span><button onclick="settings()" title="담당자 목록·새 업무 기본 리마인드 간격">⚙ 설정</button><button onclick="theme()">◐ 라이트/다크</button><button onclick="exportData()">백업</button><button onclick="$('importFile').click()">가져오기</button><input id="importFile" type="file" accept=".json" hidden onchange="importData(event)"></header>
<main>
<div class="note">업무별로 리마인드 간격(1~365일)을 설정할 수 있어요. '리마인드 완료'를 누르면 해당 업무의 간격에 따라 다음 날짜가 잡힙니다. 데이터는 현재 이 브라우저에만 저장되므로 다른 기기와 동기화하려면 온라인 DB 연결이 필요합니다. 백업을 보관해 주세요.</div>
<div class="toolbar" id="toolbar"><button class="primary" onclick="addTask()">＋ 새 업무</button><button onclick="openGroupModal()">＋ 그룹 추가</button><input class="search" id="search" placeholder="⌕ 업무 검색..." oninput="render()"><span class="grow"></span><span class="mu">업무를 체크하면 일괄 작업 메뉴가 나타나요.</span></div>
<div class="bulkbar" id="bulkbar"><b id="selCount"></b><button onclick="bulkMove()">그룹 이동</button><button onclick="bulkPri()">우선순위 변경</button><button onclick="bulkStatus()">상태 변경</button><button class="danger" onclick="bulkDelete()">삭제</button><button onclick="clearSel()">선택 해제</button></div>
<nav class="tabs"><button class="tab" data-v="today" onclick="setView('today')">☀ 오늘 확인</button><button class="tab" data-v="company" onclick="setView('company')">▦ 메인 보드</button><button class="tab" data-v="deadline" onclick="setView('deadline')">◷ 마감일별</button><button class="tab" data-v="priority" onclick="setView('priority')">⇅ 우선순위별</button><button class="tab" data-v="done" onclick="setView('done')">✔ 완료 보드</button><button class="tab" data-v="check" onclick="setView('check')">☑ 비서 점검표</button></nav>
<div id="content"></div>
</main>
<div class="modal-back" id="groupModal"><div class="modal"><h2>그룹 추가</h2><div class="field"><label class="mu">그룹 이름</label><input id="groupName" placeholder="예: 클래스"></div><div class="field"><label class="mu">그룹 색상</label><input id="groupColor" type="color" value="#6597ff" style="height:44px;padding:4px"></div><div class="ma"><button onclick="$('groupModal').classList.remove('open')">취소</button><button class="primary" onclick="saveGroup()">저장</button></div></div></div>
<script>
const ST=['진행 전','자료 대기 중','진행 중','1차','2차','수정 중','완료'],PR=['긴급','높음','보통','낮음'],DN=['지난 마감','오늘까지','내일까지','이번 주','이후','마감일 미정'];
const SC={'진행 전':'#85899c','자료 대기 중':'#a69bc9','진행 중':'#c9a227','1차':'#f2784f','2차':'#e0963a','수정 중':'#b58b1d','완료':'#2bc995'},PC={'긴급':'#e9657e','높음':'#e8963a','보통':'#8a8fa3','낮음':'#647692'},RD={'긴급':1,'높음':2,'보통':3,'낮음':7};
const $=id=>document.getElementById(id),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,today=()=>iso(new Date()),diff=s=>Math.round((new Date(s+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5),addD=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEED=[['복스','김보민 펜립 수정 메일 발송','진행 전','긴급'],['복스','김민경 펜립 메일 발송','진행 전','긴급'],['복스','국내 유통 망---------이','진행 전','보통'],['복스','안지우 타이틀 디자인','자료 대기 중','보통'],['복스','이아리 타이틀 디자인','완료','보통'],['복스','판권지 수정 그림책 드라이브 업데이트','완료','보통'],['어피니티 유니버스','2.0 커리큘럼 카드 제작','진행 전','보통'],['어피니티 유니버스','아임웹 이전 프로젝트','진행 전','보통','',['1차 기획안(큰 틀)','2차 세부 기획안(레퍼런스)']],['어피니티 유니버스','손해듬 / 이지민 / 미국 제이든 굿즈 > 슈','진행 전','보통'],['어피니티 유니버스','출간 축하 카드','1차','보통'],['어피니티 유니버스','학부모 감사 이벤트 디자인','2차','긴급','5만원 할인'],['어피니티 유니버스','폰트 클래스 바이브코딩','2차','보통'],['어피니티 유니버스','타이핑 게임 B 수정','수정 중','긴급'],['어피니티 유니버스','오채은 굿즈 주문','완료','보통']];
const CHK=[['전날 밤','내일 마감 업무','내일 마감인 업무를 모두 확인하고 우선순위 설정',''],['전날 밤','수업 일정','내일 수업 일정 안내',''],['휴강은 전날 밤 · 재개는 이틀 전','첫 수업 안내','첫 수업이라면 학부모 첫인사 메시지 필요 여부 확인','회사 구글 독스 양식 링크'],['휴강은 전날 밤 · 재개는 이틀 전','휴강·재개 안내','휴강 후 재개 수업은 전날·당일 안내 여부 체크','재개일 전날 + 당일'],['휴강은 전날 밤 · 재개는 이틀 전','대기 업무','답변·파일 대기 업무의 후속 확인일 점검',''],['오전','장기 미진행 업무','진척 없는 업무를 확인하고 다음 행동 제안',''],['즉시','일정 충돌·누락 위험','충돌 또는 지연 위험이 있으면 즉시 보고',''],['전날 밤','투두메이트','오늘 실제 처리할 핵심 업무만 오늘 목록에 등록','내일 업무는 내일 목록에'],['중요 이슈 발생 시','즉시 보고','문제·영향·해결안·대체 일정 함께 보고',''],['업무 완료 시','완료 보드 이동','완료일 기록 후 진행 중 보드에서 제거',''],['업무 완료 시','결과 확인','사용자 완료 보고를 기준으로 처리하고, 필요하면 결과 링크 기록',''],['수업 휴강 시','재개 일정 등록','재개일과 전날/당일 안내 체크를 등록',''],['매일 보고','오전 요약','오늘 할 일·우선순위·마감·주의사항 간단히 보고','']];
let S,view='today',selected=new Set(),col=new Set(),open=new Set();
function load(){try{S=JSON.parse(localStorage.getItem('affinityneo_v3'))}catch(e){}
if(!S){S={};try{S.tasks=JSON.parse(localStorage.getItem('affinityneo_tasks_v2'));S.groups=JSON.parse(localStorage.getItem('affinityneo_groups_v2'))}catch(e){}}
S.tasks=S.tasks||SEED.map((r,i)=>({id:i+1,company:r[0],task:r[1],status:r[2],priority:r[3],due:'',memo:r[4]||'',person:'최선혜',doneAt:r[2]==='완료'?today():'',subs:(r[5]||[]).map((s,j)=>({id:(i+1)*100+j,task:s,status:'진행 전',due:'',memo:''}))}));
S.groups=S.groups||[{name:'복스',color:'#6597ff'},{name:'어피니티 유니버스',color:'#a47cf0'},{name:'대학교',color:'#9a9a9a'},{name:'개인',color:'#28b987'}];
S.people=S.people||['최선혜','사장님'];S.waitDays=S.waitDays||5;
S.check=S.check||{items:CHK.map((r,i)=>({id:i+1,cycle:r[0],item:r[1],crit:r[2],note:r[3]})),done:{}};
S.tasks.forEach(t=>{t.subs=t.subs||[];t.waitSince=t.waitSince||'';t.nextRemind=t.nextRemind||'';t.reminds=t.reminds||0;t.remindDays=Number.isInteger(Number(t.remindDays))&&Number(t.remindDays)>=1?Number(t.remindDays):Number(S.waitDays)||5;t.doneAt=t.doneAt||'';if(!S.groups.some(g=>g.name===t.company))S.groups.push({name:t.company,color:'#6597ff'})});
open=new Set(S.tasks.filter(t=>t.subs.length).map(t=>t.id))}
const save=()=>localStorage.setItem('affinityneo_v3',JSON.stringify(S)),find=id=>S.tasks.find(t=>t.id===id),gc=n=>(S.groups.find(g=>g.name===n)||{}).color||'#6597ff';
function setView(v){view=v;selected.clear();render()}
function theme(){let n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('affinityneo_theme',n)}
function settings(){let p=prompt('담당자 목록 (쉼표로 구분)',S.people.join(', '));if(p!==null){let a=p.split(',').map(x=>x.trim()).filter(Boolean);if(a.length)S.people=a}let w=prompt('신규 업무의 기본 리마인드 간격 (업무별로 변경 가능)',S.waitDays);if(w&&Number.isInteger(+w)&&+w>=1)S.waitDays=+w;save();render()}
function setSt(t,v){t.status=v;t.doneAt=v==='완료'?today():'';if(v==='완료')t.subs.forEach(s=>s.status='완료')}
function upd(id,k,v,sid){let t=find(id);if(!t)return;if(sid){t.subs.find(s=>s.id===sid)[k]=v}else if(k==='status'){let o=t.subs.filter(s=>s.status!=='완료');if(v==='완료'&&o.length&&!confirm(`하위 아이템 ${o.length}개가 아직 완료되지 않았어요.\n모두 완료 처리하고 완료 보드로 이동할까요?`)){render();return}setSt(t,v)}else if(k==='remindDays'){let n=Number(v);if(!Number.isInteger(n)||n<1||n>365){alert('리마인드 간격은 1~365일로 입력해 주세요.');render();return}t.remindDays=n;if(t.waitSince)t.nextRemind=addFrom(today(),n)}else if(k==='waitSince'){t.waitSince=v;if(v){t.nextRemind=addFrom(v,t.remindDays)}else t.nextRemind=''}else t[k]=v;save();render()}
function setPerson(id,v){if(v==='__add'){v=(prompt('새 담당자 이름')||'').trim();if(!v){render();return}if(!S.people.includes(v))S.people.push(v)}upd(id,'person',v)}
function addFrom(date,days){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+Number(days));return iso(d)}
function remind(id){let t=find(id);if(t.waitSince&&t.nextRemind)t.reminds++;if(!t.waitSince)t.waitSince=today();t.nextRemind=addFrom(today(),t.remindDays);save();render()}
function addTask(gi=0){let g=S.groups[gi]||S.groups[0];if(!g){alert('먼저 그룹을 추가해 주세요.');return}let t={id:Date.now(),company:g.name,task:'새 업무',status:'진행 전',priority:'보통',due:'',memo:'',person:'',waitSince:'',nextRemind:'',remindDays:Number(S.waitDays)||5,reminds:0,doneAt:'',subs:[]};S.tasks.push(t);if(!['company','deadline','priority'].includes(view))view='company';$('search').value='';save();render();setTimeout(()=>{let x=document.querySelector(`[data-main="${t.id}"] .ce`);if(x){x.focus();x.select()}},30)}
function addSub(id){let t=find(id);t.subs.push({id:Date.now(),task:'새 하위 아이템',status:'진행 전',due:'',memo:''});open.add(id);save();render();setTimeout(()=>{let r=document.querySelectorAll(`[data-sub="${id}"] .ce`);let x=r[r.length-3]||null;if(x){x.focus();x.select()}},30)}
function delSub(id,sid){let t=find(id);t.subs=t.subs.filter(s=>s.id!==sid);save();render()}
function tgl(id){open.has(id)?open.delete(id):open.add(id);render()}function tcol(k){col.has(k)?col.delete(k):col.add(k);render()}
function tsel(k,on){on?selected.add(k):selected.delete(k);updBulk()}function clearSel(){selected.clear();render()}
function updBulk(){$('bulkbar').classList.toggle('show',selected.size>0);$('selCount').textContent=selected.size+'개 선택'}
function openGroupModal(){$('groupName').value='';$('groupColor').value='#6597ff';$('groupModal').classList.add('open')}
function saveGroup(){let n=$('groupName').value.trim();if(!n){alert('그룹 이름을 입력해 주세요.');return}if(S.groups.some(g=>g.name===n)){alert('같은 이름의 그룹이 있어요.');return}S.groups.push({name:n,color:$('groupColor').value});save();$('groupModal').classList.remove('open');view='company';render()}
function setGC(i,c){S.groups[i].color=c;save();render()}
function renGroup(i){let g=S.groups[i],n=(prompt('그룹 이름 변경',g.name)||'').trim();if(!n||n===g.name)return;if(S.groups.some(x=>x.name===n)){alert('같은 이름의 그룹이 있어요.');return}S.tasks.forEach(t=>{if(t.company===g.name)t.company=n});g.name=n;save();render()}
function delGroup(i){let g=S.groups[i];if(S.tasks.some(t=>t.company===g.name)){alert('이 그룹에 업무(완료 보드 포함)가 있어요. 먼저 다른 그룹으로 옮겨 주세요.');return}if(!confirm(`'${g.name}' 그룹을 삭제할까요?`))return;S.groups.splice(i,1);save();render()}
function dueG(t){if(!t.due)return DN[5];let n=diff(t.due);return n<0?DN[0]:n===0?DN[1]:n===1?DN[2]:n<=7?DN[3]:DN[4]}
function dd(s){let n=diff(s);return n<0?`<span class="tg r">${-n}일 지남</span>`:n===0?'<span class="tg o">오늘</span>':n===1?'<span class="tg y">내일</span>':`<span class="mu">D-${n}</span>`}
function why(t){let r=[],d=t.due?diff(t.due):null;if(d!==null){if(d<0)r.push([`지연 ${-d}일`,'r']);else if(d===0)r.push(['오늘 마감','o']);else if(d===1)r.push(['내일 마감','y'])}if(t.nextRemind&&t.nextRemind<=today())r.push(['리마인드 필요','p']);if(t.waitSince&&!t.nextRemind&&-diff(t.waitSince)>=t.remindDays)r.push([`답변 ${-diff(t.waitSince)}일째 대기`,'p']);return r}
const stSel=(v,cb)=>`<select class="pill" style="background:${SC[v]}" onchange="${cb}">${ST.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('')}</select>`;
const HEAD='<thead><tr><th class="ck"></th><th>Task</th><th>상태</th><th>우선순위</th><th>담당자</th><th>마감일</th><th title="요청을 보낸 날짜를 넣으면 며칠째 답이 없는지 자동 계산돼요">답변 대기 (요청일)</th><th title="업무마다 리마인드 간격을 지정할 수 있어요">리마인드 (간격·다음 날짜)</th><th>메모</th></tr></thead>';
function subBox(t){return `<div class="sb" style="border-left-color:${gc(t.company)}"><table><thead><tr><th class="ck"></th><th>하위 아이템</th><th>상태</th><th>Date</th><th>메모</th><th class="ck"></th></tr></thead><tbody>${t.subs.map(s=>{let k=`s:${t.id}:${s.id}`;return `<tr data-sub="${t.id}"><td class="ck"><input type="checkbox" ${selected.has(k)?'checked':''} onchange="tsel('${k}',this.checked)"></td><td><input class="ce" value="${esc(s.task)}" onchange="upd(${t.id},'task',this.value,${s.id})"></td><td style="width:140px">${stSel(s.status,`upd(${t.id},'status',this.value,${s.id})`)}</td><td style="width:160px"><input class="ce" type="date" value="${s.due||''}" onchange="upd(${t.id},'due',this.value,${s.id})"></td><td><input class="ce" value="${esc(s.memo)}" onchange="upd(${t.id},'memo',this.value,${s.id})"></td><td class="ck"><button class="x" title="삭제" onclick="delSub(${t.id},${s.id})">×</button></td></tr>`}).join('')}<tr><td></td><td colspan="5"><button class="lk" onclick="addSub(${t.id})">＋ 하위 아이템 추가</button></td></tr></tbody></table></div>`}
function row(t){let k='m:'+t.id,n=t.subs.length,dn=t.subs.filter(s=>s.status==='완료').length,w=t.waitSince?-diff(t.waitSince):null,late=w!==null&&(t.nextRemind?t.nextRemind<=today():w>=t.remindDays),rm=t.nextRemind&&t.nextRemind<=today(),ppl=[...new Set([...S.people,...(t.person?[t.person]:[])])];
return `<tr data-main="${t.id}"><td class="ck"><input type="checkbox" ${selected.has(k)?'checked':''} onchange="tsel('${k}',this.checked)"></td><td><div class="nm"><button class="tw" onclick="tgl(${t.id})" title="하위 아이템 펼치기/접기">${open.has(t.id)?'▾':'▸'}</button><input class="ce" value="${esc(t.task)}" onchange="upd(${t.id},'task',this.value)">${n?`<span class="bd ${dn===n?'ok':''}" title="완료된 하위 아이템">${dn}/${n}</span>`:''}</div></td>
<td style="width:130px">${stSel(t.status,`upd(${t.id},'status',this.value)`)}</td>
<td style="width:110px"><select class="pill" style="background:${PC[t.priority]}" onchange="upd(${t.id},'priority',this.value)">${PR.map(x=>`<option ${x===t.priority?'selected':''}>${x}</option>`).join('')}</select></td>
<td style="width:120px"><select class="ce" onchange="setPerson(${t.id},this.value)"><option value="">미정</option>${ppl.map(p=>`<option ${p===t.person?'selected':''}>${esc(p)}</option>`).join('')}<option value="__add">＋ 담당자 추가…</option></select></td>
<td><div class="fx"><input class="ce" type="date" value="${t.due||''}" onchange="upd(${t.id},'due',this.value)">${t.due?dd(t.due):''}</div></td>
<td class="${late?'alr':''}"><div class="fx"><input class="ce" type="date" value="${t.waitSince}" onchange="upd(${t.id},'waitSince',this.value)">${w===null?`<button class="mini" onclick="upd(${t.id},'waitSince',today())">오늘 요청</button>`:`<span class="tg ${late?'r':'g'}">${w}일째${late?' · 리마인드!':''}</span><button class="mini" onclick="upd(${t.id},'waitSince','')">답변 받음</button>`}</div></td>
<td class="${rm?'alr':''}"><div class="fx" style="min-width:330px;flex-wrap:wrap"><label class="mu" style="white-space:nowrap">매 <input aria-label="리마인드 간격(일)" type="number" min="1" max="365" step="1" value="${t.remindDays}" style="width:55px;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--sf);color:var(--tx)" onchange="upd(${t.id},'remindDays',this.value)"> 일</label><input aria-label="다음 리마인드 날짜" class="ce" style="width:142px;min-width:142px;height:36px" type="date" value="${t.nextRemind}" onchange="upd(${t.id},'nextRemind',this.value)"><button class="mini" title="리마인드를 보냈다면 클릭하세요. 오늘부터 설정한 간격만큼 다음 날짜를 예약합니다." onclick="remind(${t.id})">${t.nextRemind?'리마인드 완료':'시작'}</button>${t.reminds?`<span class="mu">${t.reminds}회</span>`:''}</div></td>
<td><input class="ce" value="${esc(t.memo)}" onchange="upd(${t.id},'memo',this.value)"></td></tr>${open.has(t.id)?`<tr class="sw"><td colspan="9">${subBox(t)}</td></tr>`:''}`}
function sec(title,list,color,key,extra='',foot=''){let c=col.has(key);return `<section class="group" style="--gc:${color}"><div class="gh"><button class="tw" onclick="tcol('${key}')">${c?'▸':'▾'}</button><b>${title}</b><span class="mu">${list.length} Task</span>${extra}</div>${c?'':`<div class="tw2"><table class="mt">${HEAD}<tbody>${list.map(row).join('')}</tbody></table></div>${foot}`}</section>`}
function matches(t){let q=($('search').value||'').toLowerCase();return !q||(t.task+' '+t.memo+' '+t.person+' '+t.company+' '+t.subs.map(s=>s.task+' '+s.memo).join(' ')).toLowerCase().includes(q)}
function vToday(){let act=S.tasks.filter(t=>t.status!=='완료'),d=t=>t.due?diff(t.due):null,tot=[0,0,0,0],
cnt=l=>[l.length,l.filter(t=>d(t)!==null&&d(t)<0).length,l.filter(t=>d(t)!==null&&d(t)>=0&&d(t)<=1).length,l.filter(t=>d(t)!==null&&d(t)>=0&&d(t)<=7).length],
rows=S.groups.map(g=>{let c=cnt(act.filter(t=>t.company===g.name));c.forEach((n,i)=>tot[i]+=n);return `<tr><td class="gn" style="background:${g.color}44">${esc(g.name)}</td>${c.map((n,i)=>`<td class="num ${i===1&&n?'rd':i===2&&n?'or':''}">${n}</td>`).join('')}</tr>`}).join(''),
foc=act.map(t=>({t,w:why(t)})).filter(x=>x.w.length).sort((a,b)=>(a.t.due||'9999').localeCompare(b.t.due||'9999')||PR.indexOf(a.t.priority)-PR.indexOf(b.t.priority)),
C=S.check,cd=(C.done[today()]||[]).length;
return `<div class="box"><div class="fx" style="justify-content:space-between"><b>오늘 비서 점검표 ${cd}/${C.items.length}</b><button onclick="setView('check')">점검하러 가기</button></div><div class="pb"><i style="width:${C.items.length?cd/C.items.length*100:0}%"></i></div></div>
<h3>현황</h3><div class="tw2"><table class="nv" style="max-width:720px;margin-bottom:24px"><thead><tr><th>사업</th><th>진행 프로젝트</th><th>지연</th><th>임박 (오늘·내일)</th><th>이번 주</th></tr></thead><tbody>${rows}<tr class="tot"><td>전체</td>${tot.map(n=>`<td>${n}</td>`).join('')}</tr></tbody></table></div>
<h3>지금 챙길 프로젝트 <span class="mu">(지연 · 오늘/내일 마감 · 리마인드 · 업무별 리마인드 도래, 최대 10개${foc.length>10?` · 외 ${foc.length-10}개`:''})</span></h3>
<div class="tw2"><table class="nv" style="min-width:1000px"><thead><tr><th>사업</th><th>프로젝트</th><th>챙길 이유</th><th>다음 할 일</th><th>담당</th><th>마감까지</th><th>단계</th><th>진행률</th></tr></thead><tbody>${foc.slice(0,10).map(({t,w})=>{let n=t.subs.length,dn=t.subs.filter(s=>s.status==='완료').length,nx=t.subs.find(s=>s.status!=='완료');return `<tr><td class="gn" style="background:${gc(t.company)}44">${esc(t.company)}</td><td class="l"><b>${esc(t.task)}</b></td><td class="l">${w.map(x=>`<span class="tg ${x[1]}">${x[0]}</span>`).join(' ')}</td><td class="l">${esc(nx?nx.task:t.memo||'-')}</td><td>${esc(t.person||'-')}</td><td>${t.due?dd(t.due):'-'}</td><td><span class="pl" style="background:${SC[t.status]}">${t.status}</span></td><td>${n?Math.round(dn/n*100)+'%':'-'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">오늘 급하게 챙길 업무가 없어요 🎉</td></tr>'}</tbody></table></div>`}
function vDone(){let l=S.tasks.filter(t=>t.status==='완료'&&matches(t)).sort((a,b)=>b.doneAt.localeCompare(a.doneAt));
return `<div class="box"><h3>완료 보드 <span class="mu">${l.length}개 · 업무 상태를 '완료'로 바꾸면 이곳으로 옮겨져요</span></h3><div class="tw2"><table class="nv" style="min-width:820px"><thead><tr><th>사업</th><th>업무</th><th>담당</th><th>마감일</th><th>완료일</th><th>하위 아이템</th><th></th></tr></thead><tbody>${l.map(t=>`<tr><td class="gn" style="background:${gc(t.company)}44">${esc(t.company)}</td><td class="l">${esc(t.task)}</td><td>${esc(t.person||'-')}</td><td>${t.due||'-'}</td><td>${t.doneAt||'-'}</td><td>${t.subs.length?t.subs.length+'개 완료':'-'}</td><td><button onclick="upd(${t.id},'status','진행 중')">되돌리기</button> <button class="danger" onclick="if(confirm('완전히 삭제할까요?')){S.tasks=S.tasks.filter(x=>x.id!==${t.id});save();render()}">삭제</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">아직 완료된 업무가 없어요.</td></tr>'}</tbody></table></div></div>`}
function vCheck(){let C=S.check,T=today(),dn=C.done[T]||[],p=C.items.length?Math.round(dn.length/C.items.length*100):0;
return `<div class="box"><div class="fx" style="justify-content:space-between"><div><b style="font-size:16px">비서 점검표</b> <span class="mu">${T} · 날짜가 바뀌면 체크가 자동으로 새로 시작돼요</span></div><button onclick="if(confirm('오늘 체크를 모두 해제할까요?')){S.check.done['${T}']=[];save();render()}">오늘 체크 해제</button></div><div class="pb"><i style="width:${p}%"></i></div><b>${dn.length}/${C.items.length} 완료</b>
<div class="tw2" style="margin-top:10px"><table class="mt" style="min-width:900px"><thead><tr><th class="ck"></th><th>주기</th><th>점검 항목</th><th>완료 기준</th><th>비고 / 관련 링크</th><th class="ck"></th></tr></thead><tbody>${C.items.map(i=>`<tr class="${dn.includes(i.id)?'dn':''}"><td class="ck"><input type="checkbox" ${dn.includes(i.id)?'checked':''} onchange="chk(${i.id},this.checked)"></td>${['cycle','item','crit','note'].map(k=>`<td><input class="ce" value="${esc(i[k])}" onchange="ci(${i.id},'${k}',this.value)"></td>`).join('')}<td class="ck"><button class="x" onclick="delCi(${i.id})">×</button></td></tr>`).join('')}</tbody></table></div><button class="lk" onclick="addCi()">＋ 점검 항목 추가</button></div>`}
function chk(id,on){let T=today(),a=S.check.done[T]||[];S.check.done[T]=on?[...new Set([...a,id])]:a.filter(x=>x!==id);save();render()}
function ci(id,k,v){S.check.items.find(i=>i.id===id)[k]=v;save()}
function addCi(){S.check.items.push({id:Date.now(),cycle:'',item:'새 점검 항목',crit:'',note:''});save();render()}
function delCi(id){if(!confirm('이 점검 항목을 삭제할까요?'))return;S.check.items=S.check.items.filter(i=>i.id!==id);save();render()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.v===view));$('toolbar').style.display=['company','deadline','priority','done'].includes(view)?'flex':'none';let c=$('content');
if(view==='today')c.innerHTML=vToday();else if(view==='check')c.innerHTML=vCheck();else if(view==='done')c.innerHTML=vDone();else{let l=S.tasks.filter(t=>t.status!=='완료'&&matches(t));
if(view==='company')c.innerHTML=S.groups.map((g,i)=>sec(esc(g.name),l.filter(t=>t.company===g.name),g.color,'g'+i,`<span class="ga"><input type="color" class="gcp" value="${g.color}" title="그룹 색상 바꾸기" onchange="setGC(${i},this.value)"><button onclick="renGroup(${i})">이름 변경</button><button class="danger" onclick="delGroup(${i})">삭제</button></span>`,`<div class="ft"><button class="lk" onclick="addTask(${i})">＋ 업무 추가</button></div>`)).join('')||'<div class="empty">그룹이 없어요. ＋ 그룹 추가를 눌러 주세요.</div>';
else{let ns=view==='deadline'?DN:PR;c.innerHTML=ns.map(n=>{let s=l.filter(t=>(view==='deadline'?dueG(t):t.priority)===n);return s.length?sec(n,s,view==='priority'?PC[n]:(n===DN[0]?'#e65e78':n===DN[1]?'#ff865d':'#6597ff'),view+n):''}).join('')||'<div class="empty">업무가 없어요.</div>'}}
updBulk()}
function getSel(){let o=[];selected.forEach(k=>{let p=k.split(':'),t=find(Number(p[1]));if(!t)return;if(p[0]==='m')o.push({t});else{let s=t.subs.find(x=>x.id===Number(p[2]));if(s)o.push({t:s,parent:t})}});return o}
function bulkDelete(){let it=getSel();if(!it.length||!confirm(`선택한 ${it.length}개를 삭제할까요?`))return;it.forEach(x=>{if(x.parent)x.parent.subs=x.parent.subs.filter(s=>s!==x.t);else S.tasks=S.tasks.filter(t=>t!==x.t)});selected.clear();save();render()}
function bulkMove(){let d=prompt('이동할 그룹 이름:\n'+S.groups.map(g=>g.name).join('\n'));if(!d)return;if(!S.groups.some(g=>g.name===d)){if(!confirm('없는 그룹이에요. 새로 만들까요?'))return;S.groups.push({name:d,color:'#6597ff'})}getSel().forEach(x=>(x.parent||x.t).company=d);selected.clear();save();render()}
function bulkPri(){let v=prompt('우선순위: '+PR.join(', '));if(!PR.includes(v))return;getSel().forEach(x=>{if(!x.parent)x.t.priority=v});selected.clear();save();render()}
function bulkStatus(){let v=prompt('상태: '+ST.join(', '));if(!ST.includes(v))return;getSel().forEach(x=>x.parent?x.t.status=v:setSt(x.t,v));selected.clear();save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='AffinityNeo-업무백업.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(Array.isArray(d))d={tasks:d};if(!Array.isArray(d.tasks))throw 0;localStorage.setItem('affinityneo_v3',JSON.stringify(d));load();render();alert('가져왔어요.')}catch(x){alert('파일 형식이 올바르지 않아요.')}};r.readAsText(f);e.target.value=''}
$('todayLabel').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
load();render();
</script></body></html>
